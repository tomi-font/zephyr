CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# PSA Crypto core requires an entropy source.
# nRF91's CryptoCell is not supported in vanilla Zephyr,
# so use an entropy source that's available. Not secure!
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y
CONFIG_MBEDTLS_ZEPHYR_ENTROPY=y

CONFIG_TRUSTED_STORAGE=y
